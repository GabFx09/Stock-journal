name: Stock Digest Harian

on:
  schedule:
    # 00:00 UTC = 07:00 WIB (UTC+7) setiap hari
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ──────────────────────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 3. Buat config_email.ini dari secrets ──────────────────────────────────
      - name: Write config_email.ini
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SEND_TO:            ${{ secrets.SEND_TO }}
        run: |
          cat > config_email.ini << EOF
          [email]
          sender     = $GMAIL_USER
          password   = $GMAIL_APP_PASSWORD
          recipient  = $SEND_TO
          smtp_host  = smtp.gmail.com
          smtp_port  = 587
          EOF

      # ── 4. Jalankan digest ─────────────────────────────────────────────────────
      - name: Run stock digest
        run: python stock_news_digest.py --run-now

      # ── 5. Push hasil JSON + JS ke GitHub ─────────────────────────────────────
      - name: Commit & push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # *.json di-ignore, pakai -f untuk force-add
          git add -f kalender.json sentimen.json geopolitik.json
          git add stock_analysis_data.js
          # Hanya commit jika ada perubahan
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data, skip commit."
          else
            git commit -m "chore: stock digest $(date -u '+%Y-%m-%d %H:%M UTC') [skip netlify]"
            git push
          fi

      # ── 6. Deploy ke Netlify via curl API — tunggu sampai ready ───────────────
      - name: Deploy ke Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "ERROR: NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID belum diset di GitHub Secrets!"
            echo "Silakan tambahkan kedua secret ini di: Settings → Secrets → Actions"
            exit 1
          fi
          # Zip isi repo langsung ke root (tanpa subfolder), kecuali file non-web
          zip -r ../deploy.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".claude/*" \
            -x "__pycache__/*" \
            -x "*.log" \
            -x "config_email.ini" \
            -x "*.py" \
            -x "requirements.txt"
          cd ..
          echo "Mengupload deploy ke Netlify..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @deploy.zip \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "Upload deploy gagal dengan HTTP $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi
          DEPLOY_ID=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          DEPLOY_URL=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ssl_url') or d.get('url','?'))" 2>/dev/null)
          echo "Deploy ID   : $DEPLOY_ID"
          echo "Deploy URL  : $DEPLOY_URL"
          # Polling status deploy sampai ready (max 3 menit)
          echo "Menunggu deploy selesai diproses Netlify..."
          for i in $(seq 1 18); do
            sleep 10
            STATE=$(curl -s \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/deploys/$DEPLOY_ID" | \
              python3 -c "import sys,json; print(json.load(sys.stdin).get('state','unknown'))" 2>/dev/null)
            echo "  [${i}/18] State: $STATE"
            if [ "$STATE" = "ready" ]; then
              echo "Deploy BERHASIL dan aktif di: $DEPLOY_URL"
              exit 0
            fi
            if [ "$STATE" = "error" ]; then
              echo "Deploy GAGAL — state: error"
              exit 1
            fi
          done
          echo "Timeout: deploy belum ready setelah 3 menit, cek Netlify dashboard."
          exit 1
